; ============================================================================
;  dvhdr.ini — runtime configuration for DVHDR-DWM.
;
;  Edit values then run `dvhdrloader --force` to reload — the loader copies
;  this file alongside dvhdr.dll into %SYSTEMROOT%\Temp\, where the injected
;  payload reads it on attach. (Defaults below mirror DVHDR.fx in the
;  FFXIV-Dynamic-HDR ReShade project.)
;
;  Monitor selection is configured separately via `dvhdrloader -m N` — that
;  lives in HKLM\SOFTWARE\DVHDR-DWM and is not part of this file.
; ============================================================================

[Display]
; Panel peak luminance (nits). Sparse highlights are tone-mapped toward this.
Peak = 1300.0

; Maximum sustained frame-average luminance (nits) the panel can hold without
; its ABL pulling the image down. For QD-OLED, this is typically far below
; the spec sheet's peak number.
MaxFALL = 265.0

; Minimum luminance of the panel (nits). 0 for OLED.
Black = 0.0

; Black-level lift (nits). Raises the black floor to this many nits while
; pulling the ceiling (MaxCLL) back down by the same amount, so the result stays
; exactly within [BlackLift, Peak] and nothing clips. Pure black becomes a faint
; neutral grey. For panels that crush detail right at the bottom of their range /
; cannot cleanly drive near-zero. 0 = disabled.
BlackLift = 0.00248

; --- Per-monitor capabilities (multi-screen) ---------------------------------
; When you tonemap several screens at once (e.g. `dvhdrloader -m 1,3`), each panel
; can declare its own capabilities in a [Display.N] section, where N is the
; Windows display number from `dvhdrloader --list`. Only the panel-capability
; keys are read per-monitor — Peak, MaxFALL, Black, BlackLift — and any key
; omitted there inherits the global [Display] value above. Every other setting
; ([Governor], [ToneCurve], etc.) is shared across all selected screens.
; Uncomment and adjust to taste:
;
[Display.1]
Peak = 1300
MaxFALL = 265
Black = 0.0
BlackLift = 0.00248
;
[Display.2]
Peak = 390
MaxFALL = 390
Black = 0.025
BlackLift = 0.0


[Source]
; How the proxy reads the game's back buffer.
; 0 = Auto: the colour space the game declared through SetColorSpace1 wins;
;     otherwise the format decides (FP16 = scRGB, 8-bit and 10-bit = SDR, which
;     is DXGI's own default: an HDR10 game must declare PQ to be shown as HDR).
; 1 = scRGB FP16, 2 = HDR10 PQ, 3 = SDR (gamma-encoded 8/10-bit).
; Every opaque swap chain in the process is treated on its own (a player's
; picture chain and its UI toolkit's chain each keep their own state); chains
; composed with alpha (transparent overlays) are always passed through.
ColorSpace = 0

; 0 = leave SDR chains untouched (HDR chains still processed). A quick way to
; take the SDR path out of the picture when troubleshooting an application.
ProcessSDR = 1


[SDR]
; SDR (gamma-encoded) swap chains. The pass works in nits, so an SDR buffer has
; to say how bright its white is and which curve encodes it; the lift, toe,
; deband and dither then act exactly as they do on HDR, and the output is held
; below the SDR white so nothing clips.

; Luminance (nits) of code 1.0. 0 = auto: while the display is in HDR mode this
; is the Windows "SDR content brightness" level for that monitor, read live.
WhiteNits = 0

; White used when auto cannot resolve one: the display is in SDR mode (Windows
; does not know a panel's native SDR white) or the monitor lookup fails.
FallbackWhiteNits = 200

; Transfer curve. auto = piecewise sRGB while the display is in HDR mode (how
; Windows composes SDR onto HDR), a 2.2 power law otherwise. Or force one:
; "sRGB", or a power-law exponent such as 2.2 / 2.4. (_SRGB-format back buffers
; are decoded by the hardware view and ignore this.)
Gamma = auto

; Note on [Display] BlackLift: one 8-bit SDR code step near black is 10-25x the
; HDR default floor of 0.00248 nits, so on SDR that floor survives only as a
; dithered fraction of a step (a sparse scatter of code-1 pixels). Lower it per
; game if that reads as dust rather than a faint even grey.


[Governor]
; Target frame-average as a percentage of MaxFALL. Lower = safer ABL margin.
HeadroomPercent = 90.0

; Lower bound on global gain when compressing a too-bright scene.
; Larger value = less aggressive dimming permitted.
MinGain = 0.25

; How much to brighten dim scenes. 0 = pure highlight protection (no lift).
LiftStrength = 0.25

; Upper bound on global gain when lifting dim scenes.
MaxGain = 1.5

; Above this luminance (nits) the dark-scene lift fades to none — so UI and
; in-game highlights keep their authored brightness. The lift eases smoothly in
; PQ from full at black to none at this value (a wide perceptual band). NOTE: the
; lift only engages when the scene is dimmer than the FALL target (MaxFALL ×
; Headroom%); this knob only shapes where an active lift fades — it cannot
; force one on an already-bright scene.
HighlightProtect = 80.0

; Shadow toe (nits). Below this luminance the lift eases back to identity slope,
; so the deepest blacks keep the source's own gradation instead of being
; amplified by the gain into a contouring "cliff" just above black. 0 = off.
ShadowToe = 0.25

; Luminance percentile treated as the scene peak. Below 100 ignores firefly
; pixels that would otherwise dominate the peak estimate.
PeakPercentile = 99.7

; ABL protection follows sustained energy, not a momentary flash. Compression is
; driven by a slow integrator with this time constant (seconds), so brief bright
; moments play at full brightness. 0 = the fast average drives it (the previous
; behaviour).
AblWindow = 4.0

; Safety: when the fast frame average exceeds this percentage of the FALL target,
; compression reacts at attack speed regardless of the slow integrator.
FastCeiling = 150

; Which average the dark-scene lift answers to: 1 = the perceptual (PQ) mean,
; closer to how bright a scene reads; 0 = the linear frame average (FALL), the
; previous behaviour. Compression always follows the linear average.
LiftMetric = 1


[Temporal]
; Time constant (ms) when the scene brightens. Short = react quickly to ABL.
AttackMs = 80.0

; Time constant (ms) when the scene darkens. Long = settle gently, no pumping.
ReleaseMs = 600.0

; A jump of the frame average larger than this (in PQ, 0-1) is a scene cut: the
; adaptation snaps to the new scene instead of easing into it. 0 = never snap.
SceneCut = 0.06

; Changes of the measured averages smaller than this (percent) are ignored, so a
; scene hovering around its target does not breathe.
Deadband = 2.0


[ToneCurve]
; Macro contrast — a smooth S-curve applied to the low-pass BASE about the lifted
; scene average, shaping large-scale tonal separation. 0 = off, 1.5 = strong.
DynamicContrast = 0.2

; Detail gain — the per-pixel perceptual contrast (everything finer than the base
; radius below) is re-added onto the lifted base at this gain. 1.0 = preserve
; exactly so lightened pixels keep their contrast, >1 = enhance/sharpen, 0 = off
; (flat lift). This IS the contrast-preserving local tonemap.
DetailGain = 1.0

; Base/detail split radius (pixels) — the low-pass separating "base" tone from
; "detail". Larger = smoother base, more detail preserved, softer halos at strong
; edges; smaller = finer, less halo.
DetailRadius = 12.0

; Damps below-base (darker-than-neighbourhood) detail to resist haloing at strong
; edges. 0.0 = symmetric (true contrast preservation); 1.0 = only re-add
; brighter-than-base detail.
DetailBias = 0.0

; Edge-aware base: neighbours further than this from the centre (in PQ, 0-1)
; weigh little in the blur, so the base follows edges instead of bleeding across
; them and the lift no longer halos around bright objects. 0 = plain Gaussian.
BaseEdgeSigma = 0.08

; Lift locality — where the dark-scene lift takes its reference. 0 = region: lifts
; dark AREAS but leaves a dark pixel amid brighter content alone (preserves local
; contrast). 1 = per-pixel: every dark tone lifts (more visible on mixed/desktop
; content, but flattens local contrast). 0.5 = balance.
LiftLocality = 0.0

; 1 = apply BT.2390 highlight rolloff above DisplayPeak. 0 = hard clip.
UseHighlightRolloff = 1

; Blend with the original (1.0 = full DVHDR, 0.0 = pass-through).
Strength = 1.0


[Color]
; ICtCp (DICE-style) recombine — as luminance is lifted or compressed, chroma is
; scaled to hold perceived saturation through the curve so colours stay vivid and
; hue-true instead of washing toward white (on lift) or clipping to a hue-shifted
; edge (on compression). 1.0 = full preservation, 0.0 = intensity only.
ChromaCorrect = 1.0

; Below this luminance (nits) the chroma preservation fades out, so lifted
; near-black noise lightens to grey instead of turning into saturated speckle.
; 0 = off.
ShadowDesat = 1.0

; 1 = hue-preserving gamut clip: a colour that lands outside the display gamut is
; pulled toward its own luminance until it fits, instead of having the offending
; channel chopped (which shifts the hue). 0 = clamp per channel.
GamutClip = 1


[Performance]
; Sample every Nth pixel for the histogram analyzer. 1 = every pixel,
; 2 = quarter the work, 4 = sixteenth.
AnalyzeStride = 2

; The lift base (the blurred luma) is computed at 1/N resolution: 2 = a quarter of
; the blur work with no visible loss, 1 = full resolution.
BaseDownscale = 2


[Dither]
; Blue-noise output dither to break the panel's quantisation banding at ALL
; levels, in luma AND chroma. Per-channel noise sized to one perceptual (PQ)
; code step, gated by local neighbourhood variance so flat fields stay clean
; while any region containing gradation (where banding shows) is broken up.

; Dither amplitude in code steps of the output surface: 10-bit PQ steps for HDR,
; the buffer's own 8/10-bit steps for SDR. 0 = off. ~1-2 is typical; raise for
; 8-bit panels, lower for 12-bit. This is the peak-to-peak amplitude; 2.0 is
; the textbook value for the triangular shape below.
Strength = 2.0

; Local PQ variance at which the dither reaches full strength. Smaller = more
; sensitive (engages on fainter gradients); larger = only stronger gradients.
Activity = 0.002

; Baseline dither fraction kept even on near-flat areas (0-1). Raise toward 1
; for full-frame dithering if wide flat bands persist; lower for cleaner flats.
Floor = 0.4

; 1 = the dither pattern walks each frame so it averages out over time instead of
; sitting still on the panel, and alternate frames flip its sign so each pair of
; frames averages to the unquantised value. 0 = static pattern.
Temporal = 1

; Noise shape. 1 = triangular (the sum of two uniforms): decouples the
; quantisation error from the picture so no banding-shaped noise modulation
; survives, the textbook choice. 0 = uniform, the previous behaviour.
Shape = 1

; A slow ramp (a bright sky, a glow) is locally flat, so the neighbour test
; above would leave it at the floor although it bands the worst. Gradation is
; therefore also read across this many pixels of the low-pass base, and a
; difference of WideActivity (PQ) across that span brings the dither to full
; strength.
WideSpan = 12
WideActivity = 0.0015

; Panels step more coarsely toward their peak. Above HighlightFrom (nits) the
; amplitude rises smoothly, reaching HighlightBoost times the base amplitude at
; the display peak. HighlightBoost = 1 disables it.
HighlightFrom = 200
HighlightBoost = 2.0


[Deband]
; Analytic debanding — reconstructs quantised gradients (contouring) before the
; lift can amplify them. Per channel in PQ: a region that is flat but stepped
; (neighbours within Threshold of the centre) is averaged smooth; genuine detail
; and edges (neighbours beyond Threshold) are left untouched.

; Detector sensitivity, in source code steps (10-bit PQ for HDR, the SDR
; buffer's own 8/10-bit codes). 0 = off. ~1.5-3 is typical:
; higher catches wider/coarser bands but risks softening faint real detail.
Threshold = 3.0

; Sample radius in pixels. Larger flattens broader bands but costs a little more
; and can soften if pushed too far.
Range = 16.0


[Debug]
; 0 = Off, 1 = Histogram + markers overlay in the bottom-left,
; 2 = solid red over presented pixels (write-path canary),
; 3 = show the lift base/zone as a grey ramp (black = base broken/empty).
Overlay = 0

; 1 = write a diagnostic log, one per process, to %TEMP%\dvhdrproxy-<exe>-<pid>.log
; (or AppData\LocalLow for a sandboxed process that cannot reach %TEMP%): every
; swap chain the proxy meets (window, format, size, swap effect, alpha mode,
; device, thread), how it was classified, and where the pass failed if it did.
Log = 0